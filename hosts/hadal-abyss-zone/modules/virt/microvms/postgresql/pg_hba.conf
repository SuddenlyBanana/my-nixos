# Unix-socket administration remains local to the database guest.
local all postgres peer
local all all peer

# Kubernetes workloads and OpenBao use TLS and SCRAM credentials. Database- and
# role-level privileges are provisioned with each workload's runtime bootstrap.
hostssl all all @RKE2_ADDRESS@ scram-sha-256
hostssl all all @POD_CIDR@ scram-sha-256
hostssl all openbao @OPENBAO_ADDRESS@ scram-sha-256

# The host performs logical dumps, and routed homelab clients may use roles
# provisioned for them. PostgreSQL still requires a SCRAM password.
hostssl all all @HOST_ADDRESS@ scram-sha-256
hostssl all all @HOMELAB_PREFIX@ scram-sha-256
